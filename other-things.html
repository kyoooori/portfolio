<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Other Things – Keyuri Tatu</title>
<meta name="description" content="Keyuri Tatu, product designer. Case studies in UX strategy, research and system design.">
<link rel="icon" href="/media/logo-hand.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&amp;family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B2B2B}
a{color:inherit}
@font-face{font-family:"My Hand";src:url("/fonts/MyHand.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
a:focus-visible,button:focus-visible{outline:3px solid #9BA3FF;outline-offset:3px}
@media(max-width:760px){.things{grid-template-columns:1fr!important}}

.site-header{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:1.5rem clamp(1.25rem,5vw,4rem);font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#F2F2F2}
.site-header .name{text-decoration:none;font-weight:600;font-size:22px;color:#F2F2F2}
.menu-btn{display:block;background:transparent;border:0;padding:4px 6px;border-radius:12px;cursor:pointer;line-height:0;min-width:44px;min-height:44px}
.menu-btn[aria-expanded="true"]{background:rgba(155,163,255,.14)}
.menu-btn img{height:52px;width:auto;display:block}
.site-menu{position:absolute;top:96px;right:clamp(1.25rem,5vw,4rem);width:260px;display:flex;flex-direction:column;gap:4px;padding:8px;background:#353535;border:1px solid #4A4B50;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.site-menu[hidden]{display:none}
.site-menu a{display:block;padding:12px 16px;border-radius:10px;text-decoration:none;font-size:1.25rem;font-weight:600;letter-spacing:-.01em;color:#F2F2F2}
.site-menu a:hover{background:rgba(255,255,255,.06)}
.site-menu a[aria-current="page"]{color:#9BA3FF;background:rgba(155,163,255,.14)}
body{overflow-wrap:break-word}
main{overflow-x:clip}
@media(max-width:600px){.lede{font-size:1.45rem!important}}
.video{position:relative;aspect-ratio:16/9;background:#1F1F1F}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #2B2B2B; color: #F2F2F2; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.6">
<header class="site-header"><a class="name" href="/">Keyuri Tatu</a><button type="button" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu"><img src="/media/logo-hand.png" alt=""></button><nav id="site-menu" class="site-menu" aria-label="Site" hidden><a href="/">Case Studies</a><a href="/about">About Me</a><a href="/storyline">Storyline</a><a href="/resume">Resume</a><a href="/other-things" aria-current="page">Other Things</a></nav></header>
<main style="padding: 0 clamp(1.25rem, 5vw, 4rem) 6rem">
<article style="max-width: 68rem; margin-top: 3rem">
<h1 style="font-size: clamp(2.6rem, 8vw, 6.5rem); line-height: 0.98; letter-spacing: -0.025em; font-family: 'Fraunces', Georgia, serif; font-weight: 350; font-variation-settings: 'SOFT' 50, 'WONK' 0; margin: 0 0 1rem">Other <em style="font-style: italic; font-variation-settings: 'SOFT' 100, 'WONK' 1">things</em></h1>
<p style="max-width: 44rem; color: #B4B6BF; font-family: 'My Hand', cursive; font-size: 1.8rem; line-height: 1.3; margin: 0 0 3rem">[A line about what lives here: side projects, illustration, talks, writing.]</p>
<div class="things" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem">
<div>
<div style="aspect-ratio: 4 / 3; border: 2px dashed #4A4B50; display: flex; align-items: center; justify-content: center; color: #B4B6BF">[Image]</div>
<h2 style="font-size: 1.4rem; letter-spacing: -0.01em; margin: 1rem 0 0.25rem">[Title]</h2>
<p style="margin: 0; color: #B4B6BF">[One-line description]</p>
</div>
<div>
<div style="aspect-ratio: 4 / 3; border: 2px dashed #4A4B50; display: flex; align-items: center; justify-content: center; color: #B4B6BF">[Image]</div>
<h2 style="font-size: 1.4rem; letter-spacing: -0.01em; margin: 1rem 0 0.25rem">[Title]</h2>
<p style="margin: 0; color: #B4B6BF">[One-line description]</p>
</div>
<div>

<h2 style="font-size: 1.4rem; letter-spacing: -0.01em; margin: 1rem 0 0.25rem">[Title]</h2>
<p style="margin: 0; color: #B4B6BF">[One-line description]</p>
</div>
</div>
</article>
</main>
</div>
<script>
(function(){var b=document.querySelector('.menu-btn'),m=document.getElementById('site-menu');
function set(o){m.hidden=!o;b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu')}
b.addEventListener('click',function(e){e.stopPropagation();set(m.hidden)});
document.addEventListener('click',function(e){if(!m.hidden&&!m.contains(e.target))set(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!m.hidden){set(false);b.focus()}});})();
</script>
</body>
</html>
